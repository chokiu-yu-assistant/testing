<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timemarkee v1.0.0 - Commute & Trip Time Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        accent: { emerald: '#10b981', amber: '#f59e0b', rose: '#f43f5e', cyan: '#06b6d4' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .dark .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .wheel-container { height: 108px; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .wheel-container::-webkit-scrollbar { display: none; }
        .wheel-item { height: 36px; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; font-family: monospace; font-weight: 700; font-size: 1.125rem; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-12">
    <header class="sticky top-0 z-30 glass-panel border-b border-slate-200 dark:border-slate-800 px-4 py-3">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-accent-cyan flex items-center justify-center text-white">
                    <i data-lucide="timer" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="font-extrabold text-lg bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent">Timemarkee</h1>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-brand-100 dark:bg-brand-950 text-brand-600 dark:text-brand-300">v1.0</span>
                    </div>
                    <p class="text-xs text-slate-500">Calm Commute & Trip ETA Marker</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 pt-4 space-y-5">
        <div class="glass-panel p-6 rounded-3xl text-center space-y-4">
            <h2 class="text-xl font-bold">Timemarkee v1.0.0 已成功載入！</h2>
            <p class="text-sm text-slate-500">系統運作正常，你可以開始記錄你嘅通勤行程。</p>
        </div>
    </main>
    <script>
        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }
        window.onload = function() { lucide.createIcons(); };
    </script>
</body>
</html>
